        description: "Formula small (정의서 오타: Formala)"

      - name: to_l
        agg: sum
        expr: TO_L
        description: "Formula Large (정의서 오타: Formala)"

      - name: to_tot
        agg: sum
        expr: TO_TOT
        description: "Formula total"

      - name: meas_length
        agg: avg
        expr: MEAS_LENGTH
        description: "측정 길이 (평균)"

      - name: expan_rate
        agg: avg
        expr: EXPAN_RATE
        description: "Formula adjustment (평균)"

      - name: expan_range
