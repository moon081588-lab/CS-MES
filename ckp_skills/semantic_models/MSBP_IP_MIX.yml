        description: "[정의서: '데이터 존재하지 않음']"

    measures:
      - name: ip_mix_count
        agg: count
        expr: BATCH_NO
        description: "IP 믹싱 행 수"

      - name: batch_distinct_count
        agg: count_distinct
        expr: BATCH_NO
        description: "고유 배치 개수 (사용자 지침: '배치 건수' = COUNT(DISTINCT BATCH_NO))"

      - name: mat_s
        agg: sum
        expr: MAT_S
        description: "자재 Small (Mixing Formula)"

      - name: mat_l
        agg: sum
        expr: MAT_L
        description: "자재 Large (Mixing Formula)"

      - name: mat_tot
        agg: sum
        expr: MAT_TOT
        description: "자재 Total"

      - name: mat_lot_tot
        agg: sum
        expr: MAT_LOT_TOT
        description: "자재 Lot Total"

      - name: blend_s
        agg: sum
        expr: BLEND_S
        description: "블렌딩 Small"

      - name: blend_s_s
        agg: sum
        expr: BLEND_S_S
        description: "블렌딩 Small (보조)"

      - name: blend_l
