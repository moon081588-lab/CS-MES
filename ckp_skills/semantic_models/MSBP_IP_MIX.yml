        expr: INJ_ZONE6
        description: "[정의서: '데이터 존재하지 않음']"

      - name: inj_zone7
        type: categorical
        expr: INJ_ZONE7
        description: "[정의서: '데이터 존재하지 않음']"

      - name: inj_zone8
        type: categorical
        expr: INJ_ZONE8
        description: "[정의서: '데이터 존재하지 않음']"

      - name: mold_zone1
        type: categorical
        expr: MOLD_ZONE1
        description: "[정의서: '데이터 존재하지 않음']"

      - name: mold_zone2
        type: categorical
        expr: MOLD_ZONE2
        description: "[정의서: '데이터 존재하지 않음']"

      - name: mold_zone3
        type: categorical
        expr: MOLD_ZONE3
        description: "[정의서: '데이터 존재하지 않음']"

      - name: mold_zone4
        type: categorical
        expr: MOLD_ZONE4
        description: "[정의서: '데이터 존재하지 않음']"

      - name: mold_zone5
        type: categorical
        expr: MOLD_ZONE5
        description: "[정의서: '데이터 존재하지 않음']"

